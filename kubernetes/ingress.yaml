
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-solutions-nginx
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-nginx-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /nginx
            pathType: Prefix
            backend:
              service:
                name: web-solutions-nginx
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-solutions-apache
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-apache-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /apache
            pathType: Prefix
            backend:
              service:
                name: web-solutions-apache
                port:
                  number: 80
