
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-solutions-apache
  labels:
    app: web-solutions-apache
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-solutions-apache
  template:
    metadata:
      labels:
        app: web-solutions-apache
    spec:
      containers:
        - name: apache
          image: web-solutions-apache:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-solutions-apache
spec:
  type: ClusterIP
  selector:
    app: web-solutions-apache
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
